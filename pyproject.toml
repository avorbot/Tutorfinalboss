[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "mytutor"
version = "1.0.0"
description = "MyTutor – Django LMS/CMS tutoring platform"
requires-python = ">=3.11"
authors = [
  { name = "MyTutor Team" }
]

[tool.black]
line-length = 100
target-version = ["py311"]
exclude = """
/(
  .git
  | .venv
  | node_modules
  | migrations
)/
"""

[tool.isort]
profile = "black"
line_length = 100
skip = ["migrations", "node_modules", ".venv"]

[tool.flake8]
max-line-length = 100
exclude = [
  ".git",
  ".venv",
  "node_modules",
  "*/migrations/*",
]
ignore = ["E203", "W503"]

[tool.pytest.ini_options]
pythonpath = "."
DJANGO_SETTINGS_MODULE = "lms.envs.development"
addopts = "-v --tb=short"
testpaths = ["lms", "cms"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["lms", "cms"]
omit = [
  "*/migrations/*",
  "*/tests/*",
  "manage.py",
  "*/envs/*",
]
